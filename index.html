<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#073d2d">
<title>My Money Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --paper: #f3f6f2; --surface: #ffffff; --surface-2: #f7faf6; --line: #dde6df;
  --ink: #13261d; --ink-2: #44584e; --muted: #75877d;
  --green: #0b6e4f; --green-2: #0e8a63; --green-deep: #073d2d; --green-soft: #e2f1e9;
  --marigold: #f5a524; --marigold-soft: #fff1d6; --marigold-ink: #6e4300;
  --pom: #c9364a; --pom-soft: #fbe8eb; --sky: #2f6fde; --sky-soft: #e7eefc; --plum: #7b3fa0; --plum-soft: #f3eaf8;
  --heat-0: #ecefe9; --heat-1: #fde9bf; --heat-2: #f9cf74; --heat-3: #f2a92c; --heat-4: #d4820d; --heat-5: #a65f04;
  --font: "Hind Siliguri", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --num: "Sora", "Hind Siliguri", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-l: 22px; --r: 16px; --r-s: 12px;
  --shadow: 0 1px 2px rgba(19, 38, 29, .06), 0 8px 24px rgba(19, 38, 29, .06);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --paper: #0c1511; --surface: #14201a; --surface-2: #192820; --line: #253830;
    --ink: #e6efe9; --ink-2: #b3c4ba; --muted: #869a8f;
    --green: #19a57a; --green-2: #22b98a; --green-deep: #06281d; --green-soft: #15342a;
    --marigold-soft: #3a2b10; --marigold-ink: #ffd27d;
    --pom: #ef6b7c; --pom-soft: #3a1c22; --sky: #6d9cf0; --sky-soft: #19284a; --plum: #b58ad6; --plum-soft: #2b1f37;
    --heat-0: #1d2b24; --heat-1: #4a3a17; --heat-2: #7a5a14; --heat-3: #b07f12; --heat-4: #dd9f1d; --heat-5: #f7c04e;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--font); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--marigold); outline-offset: 2px; border-radius: 8px; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.muted { color: var(--muted); }
[hidden] { display: none !important; }

/* ---------- shell ---------- */
.app { min-height: 100vh; }
.side { display: none; }
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 12px 16px;
  background: var(--paper); border-bottom: 1px solid var(--line); }
.top h1 { flex: 1; margin: 0; font: 700 20px/1.2 var(--num); }
.sync { font-size: 12px; color: var(--muted); white-space: nowrap; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); }
.icon-btn svg { width: 20px; height: 20px; }
.main { padding: 16px 14px calc(96px + env(safe-area-inset-bottom)); max-width: 1180px; margin: 0 auto; }
.page-head { display: none; }
.bnav { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end;
  background: var(--surface); border-top: 1px solid var(--line); padding: 6px 6px calc(8px + env(safe-area-inset-bottom)); }
.bnav button { border: 0; background: none; color: var(--muted); font: 600 11px/1.15 var(--font); text-align: center; display: grid; justify-items: center; gap: 2px; padding: 4px 0; }
.bnav button svg { width: 24px; height: 24px; }
.bnav button.on { color: var(--green); }
.bnav .plus { width: 58px; height: 58px; border-radius: 20px; background: var(--marigold); color: #2a1a00; margin: -24px auto 0;
  display: grid; place-items: center; box-shadow: 0 6px 16px rgba(245, 165, 36, .45); }
.bnav .plus svg { width: 28px; height: 28px; }

@media (min-width: 960px) {
  .app { display: grid; grid-template-columns: 252px 1fr; }
  .side { display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; background: var(--green-deep); color: #e8f3ed; padding: 22px 14px; }
  .top, .bnav { display: none; }
  .main { padding: 28px 36px 48px; width: 100%; }
  .page-head { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .page-head h1 { flex: 1; margin: 0; font: 700 30px/1.15 var(--num); letter-spacing: -.02em; }
}
.brand { display: flex; align-items: center; gap: 12px; padding: 4px 10px 22px; }
.brand .mark { width: 42px; height: 42px; border-radius: 13px; background: var(--marigold); color: #2a1a00; display: grid; place-items: center;
  font: 700 24px var(--num); }
.brand b { display: block; font: 700 17px/1.1 var(--num); }
.brand small { color: #9fc4b3; font-size: 13px; }
.side nav { display: grid; gap: 2px; }
.side nav button { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 0; border-radius: 12px; background: none; color: #cfe3d9;
  font: 500 15px var(--font); text-align: left; }
.side nav button svg { width: 20px; height: 20px; opacity: .9; }
.side nav button:hover { background: rgba(255, 255, 255, .06); color: #fff; }
.side nav button.on { background: rgba(255, 255, 255, .12); color: #fff; font-weight: 600; }
.side nav button .count { margin-left: auto; background: var(--marigold); color: #2a1a00; font: 700 11px var(--num); padding: 1px 7px; border-radius: 99px; }
.side .grow { flex: 1; }
.side .add-big { display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 14px; background: var(--marigold);
  color: #2a1a00; font: 700 15px var(--font); padding: 13px; margin: 14px 4px 10px; }
.side .add-big svg { width: 20px; height: 20px; }
.side .sync { color: #9fc4b3; padding: 0 10px; }

/* ---------- building blocks ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.panel + .panel, .stack > * + * { margin-top: 14px; }
.panel h2 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin: 0 0 12px; font: 600 17px/1.3 var(--num); letter-spacing: -.01em; }
.panel h2 .grow { flex: 1; }
.panel h2 a, .linkbtn { font: 600 14px var(--font); color: var(--green); text-decoration: none; border: 0; background: none; padding: 0; }
.grid { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.grid > *, .tiles > *, .stack > * { min-width: 0; }
@media (min-width: 720px) { .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 960px) { .home-grid { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); align-items: start; } }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 720px) { .tiles-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { border-radius: var(--r-s); padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); }
.tile span { display: block; font-size: 13px; color: var(--ink-2); }
.tile b { display: block; font: 600 20px/1.25 var(--num); margin-top: 2px; font-variant-numeric: tabular-nums; }
.tile small { color: var(--muted); font-size: 12px; }
.tile.t-green { background: var(--green-soft); border-color: transparent; }
.tile.t-marigold { background: var(--marigold-soft); border-color: transparent; }
.tile.t-sky { background: var(--sky-soft); border-color: transparent; }
.tile.t-plum { background: var(--plum-soft); border-color: transparent; }
.tile.t-pom { background: var(--pom-soft); border-color: transparent; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border-radius: 99px; font: 600 12px/20px var(--font); white-space: nowrap; }
.p-green { background: var(--green-soft); color: var(--green); }
.p-marigold { background: var(--marigold-soft); color: var(--marigold-ink); }
.p-pom { background: var(--pom-soft); color: var(--pom); }
.p-sky { background: var(--sky-soft); color: var(--sky); }
.p-plum { background: var(--plum-soft); color: var(--plum); }
.p-grey { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 13px; padding: 12px 18px; font: 600 15px var(--font); }
.btn svg { width: 18px; height: 18px; }
.btn-primary { background: var(--green); color: #fff; }
.btn-accent { background: var(--marigold); color: #2a1a00; }
.btn-ghost { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
.btn-danger { background: var(--pom-soft); color: var(--pom); }
.btn-sm { padding: 7px 13px; font-size: 14px; border-radius: 11px; }
.btn-block { width: 100%; }
.btn:disabled { opacity: .55; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.empty { color: var(--muted); padding: 10px 2px; }
.bar { height: 8px; background: var(--heat-0); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--green); }
.bar.over i { background: var(--pom); }
.bar.sky i { background: var(--sky); }
.bar.plum i { background: var(--plum); }
.bar.mari i { background: var(--marigold); }

/* list rows */
.rows > * { border-bottom: 1px solid var(--line); }
.rows > *:last-child { border-bottom: 0; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 2px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); }
.rows > .row:last-child { border-bottom: 0; }
button.row:hover { background: var(--surface-2); }
.ic { width: 42px; height: 42px; flex: none; border-radius: 13px; display: grid; place-items: center; font-size: 20px; background: var(--surface-2); }
.ic.sm { width: 34px; height: 34px; border-radius: 11px; font-size: 16px; }
.ic.letter { font: 700 15px var(--num); color: #fff; }
.row .t { flex: 1; min-width: 0; }
.row .t b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .t small { display: flex; gap: 6px; flex-wrap: wrap; color: var(--muted); font-size: 13px; line-height: 1.4; }
.row .a { text-align: right; font: 600 15px var(--num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .a small { display: block; font: 400 12px var(--font); color: var(--muted); }
.a.in { color: var(--green); }
.a.out { color: var(--pom); }
.a.mv { color: var(--ink-2); }
.dayhead { display: flex; justify-content: space-between; font: 600 13px var(--font); color: var(--ink-2); padding: 14px 2px 4px; border-bottom: 0 !important; }
.dayhead:first-child { padding-top: 0; }

/* hero */
.hero { position: relative; overflow: hidden; background: var(--green-deep); color: #eaf5ef; border-radius: var(--r-l); padding: 22px 22px 18px; }
.hero::after { content: ''; position: absolute; inset: 9px; border: 2px dashed rgba(245, 165, 36, .38); border-radius: 16px; pointer-events: none; }
.hero .lbl { font-size: 15px; color: #a9cdbc; }
.hero .big { font: 700 46px/1.05 var(--num); letter-spacing: -.03em; margin: 4px 0 12px; font-variant-numeric: tabular-nums; }
.hero .meter { height: 10px; background: rgba(255, 255, 255, .14); border-radius: 99px; overflow: hidden; }
.hero .meter i { display: block; height: 100%; background: var(--marigold); border-radius: 99px; }
.hero .meter.over i { background: #ff7b8c; }
.hero .facts { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font-size: 14px; color: #cfe5da; }
.hero .facts b { color: #fff; font-family: var(--num); font-weight: 600; }
.hero .facts .warn { color: #ffb3bd; font-weight: 600; }
.strip { display: grid; gap: 4px; margin-top: 18px; grid-template-columns: repeat(var(--cols), 1fr); }
@media (max-width: 719px) { .strip { grid-template-columns: repeat(16, 1fr); } }
.strip button { aspect-ratio: 1; border: 0; border-radius: 5px; padding: 0; background: rgba(255, 255, 255, .1); position: relative; }
.strip button.today { outline: 2px solid #fff; outline-offset: 1px; }
.strip button.future { background: transparent; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16); }
.strip-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 13px; color: #a9cdbc; min-height: 22px; }
.strip-foot b { color: #fff; font-family: var(--num); }
.legend { display: inline-flex; align-items: center; gap: 3px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* quick actions */
.quick-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.qa { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px 6px 10px; display: grid; justify-items: center; gap: 6px;
  font: 600 13px/1.2 var(--font); color: var(--ink); text-align: center; }
.qa .ic { width: 44px; height: 44px; border-radius: 14px; }

/* category bars */
.cbar { display: grid; grid-template-columns: 34px 1fr auto; gap: 4px 10px; align-items: center; padding: 8px 0; }
.cbar .ic { grid-row: span 2; }
.cbar .nm { font-weight: 600; font-size: 15px; }
.cbar .v { font: 600 15px var(--num); text-align: right; font-variant-numeric: tabular-nums; }
.cbar .bar { grid-column: 2 / 4; }
.cbar .s { grid-column: 2 / 4; font-size: 12px; color: var(--muted); margin-top: -2px; }
.cbar.over .s { color: var(--pom); font-weight: 600; }

/* forms */
.fld { display: block; margin-bottom: 14px; position: relative; }
.fld > span, .lbl { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 0 0 6px 2px; }
.fld .hint { display: block; font-size: 12px; color: var(--muted); margin: 5px 2px 0; font-weight: 400; }
input[type=text], input[type=date], input[type=number], input[type=search], select, textarea {
  width: 100%; min-height: 48px; padding: 11px 13px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface); font-size: 16px; outline: none; }
textarea { min-height: 120px; font-size: 14px; line-height: 1.5; }
input:focus, select:focus, textarea:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
.row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.row2 > *, .row3 > * { min-width: 0; }
input[type=date] { min-width: 0; max-width: 100%; }
.row3 { display: grid; grid-template-columns: 1.4fr .8fr 1fr; gap: 10px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--surface-2); border: 1px solid var(--line); padding: 4px; border-radius: 14px; margin-bottom: 14px; }
.seg button { border: 0; background: none; border-radius: 10px; padding: 9px 4px; font: 600 14px var(--font); color: var(--ink-2); }
.seg button.on { background: var(--green); color: #fff; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 7px 13px; font: 500 14px var(--font); min-height: 38px;
  display: inline-flex; align-items: center; gap: 6px; }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; }
.chip.on { background: var(--green); border-color: var(--green); color: #fff; font-weight: 600; }
.chip small { color: var(--muted); font-family: var(--num); }
.chip.on small { color: inherit; opacity: .85; }
.hscroll { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; scrollbar-width: none; }
.hscroll::-webkit-scrollbar { display: none; }
.hscroll .chip { flex: none; white-space: nowrap; }
.total-line { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: -4px 2px 14px; }
.total-line b { font: 700 28px var(--num); font-variant-numeric: tabular-nums; }
.total-line small { flex-basis: 100%; color: var(--muted); font-size: 13px; }
.sugg { position: absolute; z-index: 5; left: 0; right: 0; top: 100%; margin-top: 4px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 13px; box-shadow: var(--shadow); max-height: 290px; overflow-y: auto; display: none; }
.sugg.on { display: block; }
.sugg div { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.sugg div:last-child { border-bottom: 0; }
.sugg div b { flex: 1; font-weight: 500; }
.sugg div small { color: var(--muted); white-space: nowrap; font-size: 13px; }
.sugg div.new b { color: var(--green); font-weight: 600; }
.sheet-actions { display: flex; gap: 10px; margin-top: 6px; }
.sheet-actions .btn-primary { flex: 1; }
.note { font-size: 13px; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 14px; }
.note.warn { background: var(--marigold-soft); border-color: transparent; color: var(--marigold-ink); }

/* sheet (dialog) */
.sheet-wrap { position: fixed; inset: 0; z-index: 60; background: rgba(6, 22, 15, .5); display: none; align-items: flex-end; justify-content: center; }
.sheet-wrap.on { display: flex; }
.sheet { width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; background: var(--surface); border-radius: 24px 24px 0 0;
  padding: 10px 18px calc(20px + env(safe-area-inset-bottom)); animation: up .22s ease-out; }
.sheet .grab { width: 44px; height: 5px; border-radius: 99px; background: var(--line); margin: 0 auto 10px; }
.sheet-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.sheet-head h3 { flex: 1; margin: 0; font: 700 20px var(--num); }
@media (min-width: 720px) { .sheet-wrap { align-items: center; } .sheet { border-radius: 24px; padding: 22px 26px 24px; } .sheet .grab { display: none; } }
@keyframes up { from { transform: translateY(28px); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }

/* toast */
#toast { position: fixed; z-index: 80; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom)); background: #10241b; color: #fff;
  padding: 11px 16px; border-radius: 14px; font-size: 15px; max-width: 92vw; box-shadow: 0 10px 30px rgba(0, 0, 0, .25); display: none; }
#toast.err { background: var(--pom); }
@media (min-width: 960px) { #toast { bottom: 28px; } }

/* misc */
.searchbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
.searchbar input { flex: 1; }
.monthnav { display: flex; align-items: center; gap: 8px; }
.monthnav b { font: 600 16px var(--num); min-width: 140px; text-align: center; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.filters select { width: auto; min-height: 40px; padding: 6px 10px; font-size: 14px; border-radius: 11px; }
.summary-line { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.chart svg { display: block; width: 100%; }
.chart text { fill: var(--muted); font: 11px var(--num); }
.chart .tipline { font-size: 14px; color: var(--ink-2); min-height: 22px; margin-bottom: 6px; }
.chart .tipline b { color: var(--ink); font-family: var(--num); }
.person-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.person-head .ic { width: 56px; height: 56px; border-radius: 18px; font-size: 22px; }
.person-head h2 { margin: 0; font: 700 22px var(--num); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; font-size: 15px; }
.kv span { color: var(--ink-2); }
.kv b { font-family: var(--num); font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.attn { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--marigold-soft); color: var(--marigold-ink);
  border: 0; width: 100%; text-align: left; font: 500 15px var(--font); }
.attn + .attn { margin-top: 8px; }
.attn b { font-weight: 700; }
.attn .go { margin-left: auto; font-weight: 700; }
.loading { display: grid; place-items: center; gap: 12px; padding: 80px 0; color: var(--muted); }
.loading .mark { width: 54px; height: 54px; border-radius: 16px; background: var(--marigold); color: #2a1a00; display: grid; place-items: center; font: 700 30px var(--num); }
.more-list .row .ic { background: var(--green-soft); color: var(--green); }
.more-list .row .ic svg { width: 22px; height: 22px; }
.wa { background: #25d366; color: #05361a; }
a.btn { text-decoration: none; }
input[type=time] { width: 100%; min-height: 48px; padding: 11px 13px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface); font-size: 16px; outline: none; }
.rowmain { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; background: none; border: 0; padding: 0; text-align: left; }
.cal-head, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }

  function acctsFor(q) {

  AFTER.budget = function () {

    const hist = (first < 0 ? [] : all.slice(first)).slice(-24);
    if (!hist.length) { box.innerHTML = '<div class="empty">No history yet.</div>'; return; }
    const W = Math.max(300, box.clientWidth || 320), H = 190, top = 18, bottom = 24;
    const n = hist.length, band = W / n, bw = Math.min(24, Math.max(4, band - 3));
    const max = Math.max.apply(null, hist.map(h => h[1]).concat([1]));
    const nice = (v => { const p = Math.pow(10, Math.floor(Math.log10(v))); const f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; })(max);
    const y = v => top + (H - top - bottom) * (1 - v / nice);
    const budget = D.summary.budget;
    let s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Spending per month">';
    s += '<line x1="0" x2="' + W + '" y1="' + y(nice) + '" y2="' + y(nice) + '" stroke="var(--line)" stroke-dasharray="3 3"/><text x="' + (W - 2) + '" y="' + (y(nice) - 5) + '" text-anchor="end">' + esc(short(nice)) + '</text>';

      if (v > 0) { const yt = y(v), r = Math.min(4, bw / 2, y(0) - yt); s += '<path class="mbar" data-i="' + i + '" d="M' + x + ',' + y(0) + 'V' + (yt + r) + 'Q' + x + ',' + yt + ' ' + (x + r) + ',' + yt + 'H' + (x + bw - r) + 'Q' + (x + bw) + ',' + yt + ' ' + (x + bw) + ',' + (yt + r) + 'V' + y(0) + 'Z" fill="' + (isNum(budget) && v > budget ? 'var(--green)' : 'var(--green)') + '"/>'; }

  /** Reads a photo and makes it a small square picture. fit: 'cover' (fill the square, the middle is kept) or 'contain' (the whole picture). */

  /** version 11: change a People amount at once (tap the amount on a person page). The amount on their bill is what
   *  counts in what you owe each other; for your own entries the amount from your account (moves your balance) is here too. */
  function amountForm(kind, row) {
    const r = kind === 'om' ? (D.om || []).find(x => x[0] === row) : (D.pfp || []).find(x => x[0] === row);
    if (!r) return;
    const b = kind === 'om' ? billOf(r) : r;
    if (!b) return omForm({ row: row });   // kept off their bill: the full form can put it on
    const ba = amtOf(b, UI.pfp), ra = kind === 'om' ? amtOf(r, UI.om) : null;
    const fee = ra && isNum(r[9]) ? r[9] : 0;
    const f$ = n => fmtCur(ba.cur, n);
    const auto = a => r2(ra.dir === 'in' ? a - fee : a + fee);
    let follow = !!ra && ba.dir === ra.dir && sameAmt(ba.v, auto(ra.v));   // the bill follows your account amount until you type on the bill
    const person = peopleAll().find(p => p.name === b[2]) || { hold: 0, holdUsd: 0 };
    const holdNow = ba.cur === 'USD' ? (person.holdUsd || 0) : (person.hold || 0);
    const eff = v => ba.dir === 'in' ? v : -v;
    openSheet('Change the amount',
      '<div class="note"><b>' + esc(b[2]) + '</b> · ' + esc(isNum(b[1]) ? fmtDay(b[1], true) : 'no date') + ' · ' + (ba.dir === 'in' ? 'Money in' : 'Money out') + (b[6] ? ' · ' + esc(b[6]) : '') + '</div>' +
      '<label class="fld"><span>Amount on ' + esc(b[2]) + '’s bill (used for the balance)</span><input type="text" inputmode="decimal" id="am-bill" value="' + esc(ba.v) + '" autocomplete="off"></label>' +
      (ra ? '<label class="fld"><span>Amount from your account' + (r[5] ? ' (' + esc(shortAcct(r[5])) + ')' : '') + '</span><input type="text" inputmode="decimal" id="am-acct" value="' + esc(ra.v) + '" autocomplete="off">' +
          '<span class="hint">' + (r[5] ? 'Moves your ' + esc(shortAcct(r[5])) + ' balance.' : 'No account: it moves no balance.') + (fee ? ' Your fee ' + esc(f$(fee)) + ' stays as it is.' : '') + '</span></label>'
        : '<div class="note">This line is only on the bill: it moves no account.</div>') +
      '<div class="bb-see" id="am-see"></div>' +
      '<div class="sheet-actions"><button class="btn btn-ghost" id="am-more">More (date, note, account)</button><button class="btn btn-primary" id="am-save">Save</button></div>',
      root => {
        const paint = () => {
          const bv = toNum($('am-bill').value);
          if (!(bv > 0)) { $('am-see').innerHTML = ''; return; }
          const after = r2(holdNow - eff(ba.v) + eff(bv));
          $('am-see').innerHTML = 'They see: <b>' + (ba.dir === 'in' ? 'Received ' : 'Paid ') + esc(f$(bv)) + '</b><br>' +
            esc(b[2]) + '’s balance: <b>' + esc(after > 0.005 ? 'you owe them ' + f$(after) : after < -0.005 ? 'they owe you ' + f$(-after) : 'settled') + '</b>' +
            (sameAmt(bv, ba.v) ? '' : ' <span class="muted">(now ' + esc(holdNow > 0.005 ? 'you owe them ' + f$(holdNow) : holdNow < -0.005 ? 'they owe you ' + f$(-holdNow) : 'settled') + ')</span>');
        };
        $('am-bill').addEventListener('input', () => { follow = false; paint(); });
        if (ra) $('am-acct').addEventListener('input', () => { const a = toNum($('am-acct').value); if (follow && a > 0) $('am-bill').value = String(auto(a)); paint(); });
        paint();
        const inp = $('am-bill'); setTimeout(() => { try { inp.focus(); inp.select(); } catch (e) { /* ignore */ } }, 60);
        $('am-more').addEventListener('click', () => { closeSheet(); if (kind === 'om') omForm({ row: r[0] }); else pfpForm({ row: r[0] }); });
        $('am-save').addEventListener('click', async () => {
          const bv = toNum($('am-bill').value), av = ra ? toNum($('am-acct').value) : NaN;
          if (!(bv > 0)) return toast('Type the amount on the bill.', true);
          if (ra && !(av > 0)) return toast('Type the amount from your account.', true);
          const billCh = !sameAmt(bv, ba.v), acctCh = !!ra && !sameAmt(av, ra.v);
          if (!billCh && !acctCh) return closeSheet();
          try {
            if (acctCh) {
              if (fee && ra.dir === 'in' && fee >= av) return toast('The amount must be more than your fee (' + f$(fee) + ').', true);
              const p = { uid: uid(), row: r[0], orig: r[2], date: isNum(r[1]) ? sToIso(r[1]) : '', person: r[2], inn: ra.dir === 'in' ? av : '', out: ra.dir === 'out' ? av : '', cur: ra.cur,
                acct: r[5] || '', note: r[6] || '', fee: D.v7ready !== false ? (fee || '') : undefined, bill: { amt: bv, note: b[6] || '' } };
              await save('omUpdate', p, 'Saved · your account ' + f$(av) + ' · their bill ' + f$(bv), $('am-save'));
            } else {
              const p = { uid: uid(), row: b[0], orig: b[2], date: isNum(b[1]) ? sToIso(b[1]) : '', person: b[2], inn: ba.dir === 'in' ? bv : '', out: ba.dir === 'out' ? bv : '', cur: ba.cur, via: b[5] || '', note: b[6] || '' };
              await save('pfpSave', p, 'Their bill now says ' + f$(bv) + '. The balance uses it.', $('am-save'));
            }
            closeSheet();
          } catch (e) { /* shown */ }
        });
      });
  }

  function workMonthForm(name) {

    const ym = D.today.slice(0, 7), mName = MONTH[+ym.slice(5, 7) - 1];
    if (QUEUE.some(q => q.fn === 'workAdd' && q.p && q.p.company === c.name)) return toast('Some ' + c.name + ' minutes are still waiting to save. Try again when they are saved.', true);
    const b = workStats(ym).byCo[c.name] || { usd: 0, bdt: 0, min: 0, n: 0 };
    const cur = Math.round(b.min * 100) / 100, fx = fxNow();
    openSheet(c.name + ': ' + mName + ' total',
      '<div class="kv" style="margin-bottom:14px"><span>Minutes logged in ' + esc(mName) + '</span><b>' + esc(minNum(cur)) + ' min</b>' +
        '<span>Earned in ' + esc(mName) + '</span><b>' + usd(b.usd) + ' = ' + money(b.bdt, 0) + '</b><span>Rate</span><b>' + esc(rateTxt(c.rate)) + ' a minute</b></div>' +
      '<label class="fld"><span>Total minutes for ' + esc(mName) + '</span><input type="text" inputmode="decimal" id="wm-min" autocomplete="off" value="' + esc(String(cur)) + '"><span class="hint">Type the month total your ' + esc(c.name) + ' account shows.</span></label>' +
      '<div class="total-line"><b id="wm-usd">' + usd(b.usd) + '</b><span class="muted" id="wm-bdt"></span><small id="wm-calc"></small></div>' +
      '<div class="note">Your own entries stay as they are. The app adds one correction line to the Work Log for the difference (dated today), so the month total, the dollars and the taka all change with it. If you edit the total again, the same correction line is updated.</div>' +
      '<div class="sheet-actions"><button class="btn btn-primary" id="wm-save">Save month total</button></div>',
      root => {
        const el = $('wm-min');
        const paint = () => {
          const v = toNum(el.value), ok = isNum(v) && v >= 0;
          const d = ok ? Math.round((v - cur) * 100) / 100 : 0, dUsd = Math.round(d * c.rate * 100) / 100;
          const newUsd = Math.round((b.usd + dUsd) * 100) / 100;
          $('wm-usd').textContent = ok ? usd(newUsd) : usd(b.usd);
          $('wm-bdt').textContent = ok && isNum(fx) ? '≈ ' + money(b.bdt + dUsd * fx, 0) : '';
          $('wm-calc').textContent = !ok ? 'Type the minutes as a number.' : Math.abs(d) < 0.005 ? 'Same as your entries: nothing to change.' :
            (d > 0 ? '+' : '−') + minNum(Math.abs(d)) + ' min × ' + rateTxt(c.rate) + ' = ' + (d > 0 ? '+' : '−') + usd(Math.abs(dUsd)) + (isNum(fx) ? ' (≈ ' + (d > 0 ? '+' : '−') + money(Math.abs(dUsd * fx), 0) + ')' : '');
        };
        el.addEventListener('input', paint);
        el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('wm-save').click(); } });
        paint();
        setTimeout(() => { try { el.focus(); el.select(); } catch (e) { /* ignore */ } }, 60);
        $('wm-save').addEventListener('click', async () => {
          const v = toNum(el.value);
          if (!(isNum(v) && v >= 0)) return toast('Type the total minutes (0 or more).', true);

          } catch (e) { /* shown */ }
        });
      });

  const BN_DIGITS = '০১২৩৪৫৬৭৮৯';
  function acctKeys() {
    const all = (D.lists.accounts || []).concat(D.lists.usdAccounts || []), keys = [];
    all.forEach(a => {
      const l = a.toLowerCase(); keys.push([l, a]);
      const w = l.replace(/\(.*?\)/g, '').split(/\s+/).filter(Boolean);
      if (w[0] && !keys.some(k => k[0] === w[0])) keys.push([w[0], a]);

      .forEach(k => { if (k[1] && all.indexOf(k[1]) >= 0) keys.unshift(k); });

  function parseQuick(text) {
    const raw = String(text || '').replace(/[০-৯]/g, d => String(BN_DIGITS.indexOf(d))).trim();
    if (!raw) return null;
    let toks = raw.split(/\s+/);
    const low = () => toks.map(t => t.toLowerCase());
    const out = { kind: '', amt: NaN, fee: NaN, cur: 'BDT', accts: [], dir: '', person: '', words: [] };
    // fee N
    for (let i = 0; i < toks.length - 1; i++) if (/^fee$/i.test(toks[i]) && /^[৳$]?\d[\d,]*(\.\d+)?$/.test(toks[i + 1])) { out.fee = toNum(toks[i + 1].replace(/[৳$]/, '')); toks.splice(i, 2); break; }
    // accounts (longest names first)
    const keys = acctKeys();
    for (let i = 0; i < toks.length; i++) {
      for (const k of keys) {
        const n = k[0].split(' ').length, chunk = low().slice(i, i + n).join(' ');
        if (chunk === k[0]) { out.accts.push({ at: i, a: k[1] }); toks.splice(i, n, '\u0000'); break; }
      }
    }
    const hasTo = low().some((t, i) => (t === 'to' || t === '→') && toks[i - 1] === '\u0000' && toks[i + 1] === '\u0000');
    // people (full name, or a first word only one person has)
    const names = personNames().sort((a, b) => b.length - a.length);
    for (const n of names) {
      const w = n.toLowerCase().split(/\s+/), L = low();
      for (let i = 0; i + w.length <= L.length; i++) if (L.slice(i, i + w.length).join(' ') === w.join(' ')) { out.person = n; toks.splice(i, w.length); break; }
      if (out.person) break;
    }
    if (!out.person) {
      const L = low();
      for (let i = 0; i < L.length; i++) { const m = names.filter(n => L[i].length >= 4 && n.toLowerCase().split(/\s+/)[0] === L[i]); if (m.length === 1) { out.person = m[0]; toks.splice(i, 1); break; } }
    }
    // direction, amount, money-in words
    const rest = [];
    let incomeWord = false, cashOut = false;
    toks.forEach((t, i) => {
      const l = t.toLowerCase();
      if (t === '\u0000' || l === 'to' || l === '→') return;
      if (/^(in|received|receive|got|get)$/.test(l)) { out.dir = 'in'; return; }
      if (/^(out|paid|pay|gave|give|sent|send)$/.test(l)) { out.dir = 'out'; return; }
      if (/^(withdraw|withdrawal|cashout)$/.test(l) || (l === 'cash' && /^out$/i.test(toks[i + 1] || ''))) { cashOut = true; return; }
      const m = /^([৳$])?(\d[\d,]*(?:\.\d+)?)(tk|taka|৳|usd|\$)?$/i.exec(t);
      if (m && isNaN(out.amt)) { out.amt = toNum(m[2]); if (m[1] === '$' || /usd|\$/i.test(m[3] || '')) out.cur = 'USD'; return; }
      if (/^(income|profit|salary|refund|interest)$/.test(l)) incomeWord = true;
      rest.push(t);
    });
    out.words = rest;
    const words = rest.join(' ').trim();
    if (out.person) { out.kind = 'om'; out.note = words; out.acct = out.accts[0] ? out.accts[0].a : ''; if (out.acct && (D.lists.usdAccounts || []).indexOf(out.acct) >= 0) out.cur = 'USD'; }
    else if (out.accts.length >= 2 && hasTo || cashOut) { out.kind = 'move'; out.from = out.accts[0] ? out.accts[0].a : ''; out.to = cashOut && out.accts.length < 2 ? 'Cash' : (out.accts[1] ? out.accts[1].a : ''); out.item = words || (out.to === 'Cash' ? 'Cash withdrawal / cash out' : 'Move money to my other account'); }
    else if (incomeWord || out.dir === 'in') { out.kind = 'in'; out.item = words || 'Money received'; out.acct = out.accts[0] ? out.accts[0].a : lastAcctFor('in'); }
    else {
      out.kind = 'exp';
      const o = IDX.get(words.toLowerCase());

      out.cat = o ? catOf(o) : '';

      if (isNaN(out.amt) && o && isNum(priceOf(o))) out.amt = priceOf(o);
      out.acct = out.accts[0] ? out.accts[0].a : (o && o.lastAcct && spendAccounts().indexOf(o.lastAcct) >= 0 ? o.lastAcct : lastAcctFor('exp'));

  /* ---------- budget from the last 3 months, groups, monthly report ---------- */
  function budgetSuggest() {
    const cur = monthBounds(D.today.slice(0, 7)).start;
    const months = (D.history.months || []).filter(m => m[0] < cur && m[1] > 0).slice(-3);
    if (!months.length) return toast('Not enough months yet.', true);
    const avg = arr => arr.reduce((s, x) => s + x, 0) / Math.max(1, arr.length);
    const r100 = n => Math.round(n / 100) * 100, r1000 = n => Math.round(n / 1000) * 1000;
    const budget = r1000(avg(months.map(m => m[1])));
    const plans = {};
    (D.history.cats || []).forEach((c, k) => { const v = r100(avg(months.map(m => m[2][k] || 0))); if (v > 0) plans[c] = v; });
    // groups: from your entries in those months (entries start on 1 Sep 2026)
    const gm = {}, seen = {};
    (D.rows || []).forEach(r => {
      if (!isNum(r[1]) || !isNum(r[6]) || !isSpend(r[3])) return;
      const m = months.find(x => r[1] >= x[0] && r[1] < monthBounds(sToIso(x[0]).slice(0, 7)).end); if (!m) return;
      const g = groupOf(r) || 'Not named yet'; seen[m[0]] = 1;
      gm[g] = (gm[g] || 0) + r[6];
    });
    const nM = Math.max(1, Object.keys(seen).length), groupPlans = {};
    Object.keys(gm).forEach(g => { const v = r100(gm[g] / nM); if (v > 0) groupPlans[g] = v; });
    const label = months.map(m => MON[sToDate(m[0]).getUTCMonth()]).join(', ');

      '<h3 class="mini">By group <span class="muted">(' + nM + ' month' + (nM === 1 ? '' : 's') + ' of entries)</span></h3><div class="kv" style="margin-bottom:12px">' + Object.keys(groupPlans).sort((a, b) => groupPlans[b] - groupPlans[a]).map(g => '<span>' + esc((GROUP_ICON[g] || '') + ' ' + g) + '</span><b>' + money(groupPlans[g], 0) + '</b>').join('') + '</div>' +

        });
      });
  }

      const title = ns ? 'message ' + stDay(TODAY, true) : st.from !== null ? stDay(st.from, true) + ' to ' + stDay(st.to, true) : 'up to ' + stDay(st.to, true);
      const html = ns ? textPdfHtml(S.arg, noteFull(ns).text) : statementHtml(st);
      try { const r = await save('makeStatementPdf', { person: st.name, title: title, html: html }, null, el); sentBill(S.arg);
        openSheet('Statement PDF', '<div class="note">Saved in your Drive folder "My Money statements" (private to you). Open it, then use Drive\'s share or download button to send it.</div><a class="btn btn-primary btn-block" target="_blank" rel="noopener" href="' + esc(r.url) + '">Open ' + esc(r.name) + '</a>'); } catch (e) { /* shown */ }
    },
    'work-edit': el => { const r = ((D.work || {}).rows || []).find(x => x[0] === +el.dataset.row); if (!r) return; if (r[9]) return queueSheet(); workForm({ row: r[0] }); },
    'inc-month': el => { S.incYm = shiftMonth(S.incYm || D.today.slice(0, 7), +el.dataset.k); if (S.incYm > D.today.slice(0, 7)) S.incYm = D.today.slice(0, 7); render(); },
    'rate-refresh': async el => { try { await save('rateRefresh', null, x => 'Dollar rate today: ৳' + Number(x.rate).toFixed(2) + ' (' + x.source + ')', el); } catch (e) { /* shown */ } },
    'pic': el => picSheet(el.dataset.kind, el.dataset.name),   // version 8
    'inc-co': el => { S.incCo = el.dataset.co || ''; if (S.page !== 'income') go('income'); else { render(); window.scrollTo(0, 0); } },   // version 8.1
    'co-add': () => companyForm(null),
    'co-edit': el => companyForm(+el.dataset.row),
    'cs-save-about': async el => { try { await save('settingsSave', { name: $('cs-name').value.trim(), startPage: $('cs-start').value }, 'Saved', el); } catch (e) { /* shown */ } },
    'cs-save-home': async el => { const on = Array.from(document.querySelectorAll('[data-home]')).filter(x => x.checked).map(x => x.dataset.home);
      try { await save('settingsSave', { homeSections: on.join(',') }, 'Saved. Your Home page is updated.', el); } catch (e) { /* shown */ } },
    'cs-save-rem': async el => { const r = S.csRem !== undefined ? S.csRem : defaultRemind();
      try { await save('settingsSave', { reminderMinutes: r === '' ? '' : String(r), reminderTime: $('cs-time').value || '09:00' }, 'Saved', el); } catch (e) { /* shown */ } }
  };
  document.addEventListener('click', e => {
    const g = e.target.closest('[data-go]');
    if (g) { e.preventDefault(); if ($('sheet-wrap').classList.contains('on')) { $('sheet-wrap').classList.remove('on'); $('sheet-body').innerHTML = ''; document.body.style.overflow = ''; } go(g.dataset.go, g.dataset.arg); return; }
    const a = e.target.closest('[data-act]');
    if (a && ACT[a.dataset.act] && a.dataset.act !== 'heat') {
      e.preventDefault();
      if (+a.dataset.row >= 9e8 && PENDING_ACTS.indexOf(a.dataset.act) >= 0) return pendingTap();   // version 8
      ACT[a.dataset.act](a);
    }
  });
  let resizeT;
  window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (D && (S.page === 'budget' || S.page === 'income') && !$('sheet-wrap').classList.contains('on')) render(); }, 200); });
  const onHistory = st => { st = st || {}; if (st.page) { if ($('sheet-wrap').classList.contains('on')) { $('sheet-wrap').classList.remove('on'); document.body.style.overflow = ''; } go(st.page, st.arg, true); } };
  if (IN_GAS) { try { google.script.history.setChangeHandler(e => onHistory(e.state)); } catch (e) { /* not available */ } }
  else window.addEventListener('popstate', e => onHistory(e.state));

  /* =================== version 12: the installed app =================== */
  // Connect once: the link that ends in /exec (Deploy → New deployment, "Anyone") and the key from makeAppKey.
  // A link like …/money/#connect=LINK|KEY fills both in by itself (and is then removed from the address bar).
  function askConnect(msg) { NEED_CONNECT = msg || 'Connect this phone to your sheet.'; showConnect(); }
  function showConnect() {
    const c = apiConf() || JSON.parse(sessionStorage.getItem('mmb.pre') || 'null') || {};
    $('page-title').textContent = 'Connect'; $('top-title').textContent = 'My Money Book';
    $('bnav').hidden = true;
    $('page').innerHTML = '<section class="panel" style="max-width:560px;margin:0 auto"><h2>Connect to your sheet</h2>' +
      '<div class="note' + (/fit|not made/i.test(NEED_CONNECT) ? ' warn' : '') + '">' + esc(NEED_CONNECT) + '</div>' +
      '<p class="muted" style="margin-top:0">You do this once on this phone. The link and the key stay only on this phone; this app\'s files have neither.</p>' +
      '<label class="fld"><span>1. Your app link (from Apps Script → Deploy; it ends in /exec)</span><input type="text" inputmode="url" id="cx-url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(c.url || '') + '"></label>' +
      '<label class="fld"><span>2. Your key (from makeAppKey)</span><input type="text" id="cx-key" autocomplete="off" autocapitalize="off" spellcheck="false" value="' + esc(c.key || '') + '"></label>' +
      '<div class="sheet-actions"><button class="btn btn-primary" id="cx-go">Connect</button></div>' +
      (apiConf() ? '<p class="muted" style="font-size:13px">Connected before on this phone. If you made a new key, type it above.</p>' : '') + '</section>';
    $('cx-go').addEventListener('click', async () => {
      const url = $('cx-url').value.trim(), key = $('cx-key').value.trim();
      if (!/^https:\/\/script\.google(usercontent)?\.com\/.+\/exec\b/.test(url)) return toast('Paste the app link that ends in /exec.', true);
      if (key.length < 16) return toast('Paste your key (32 letters and numbers).', true);
      const b = $('cx-go'); b.disabled = true; b.textContent = 'Connecting…';
      try {
        const r = await apiCall({ url: url, key: key }, 'ping');
        localStorage.setItem(API_STORE, JSON.stringify({ url: url, key: key, at: Date.now() }));
        sessionStorage.removeItem('mmb.pre');
        NEED_CONNECT = ''; $('bnav').hidden = false;
        toast('Connected' + (r && r.name ? ' to ' + r.name + '’s sheet' : '') + '.');
        if (D) render(); else $('page').innerHTML = '<div class="empty">Reading your sheet…</div>';
        refresh(false).then(() => flushQueue());
      } catch (e) { toast(errMsg(e).replace(/ \(key\)$/, ''), true); b.disabled = false; b.textContent = 'Connect'; }
    });
  }
  function installedSetup() {
    // the app's name, icon and offline copy (only outside Apps Script; inside it these files do not exist)
    [['manifest', 'manifest.webmanifest'], ['icon', 'icon-192.png'], ['apple-touch-icon', 'icon-192.png']].forEach(x => {
      const l = document.createElement('link'); l.rel = x[0]; l.href = x[1]; document.head.appendChild(l);
    });
    if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
    const m = /#connect=([^&]+)/.exec(location.hash || '');
    if (m) {
      const parts = decodeURIComponent(m[1]).split('|');
      if (parts.length === 2) sessionStorage.setItem('mmb.pre', JSON.stringify({ url: parts[0], key: parts[1] }));
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* ignore */ }
    }
    try { history.replaceState({ page: S.page, arg: S.arg }, ''); } catch (e) { /* ignore */ }
  }

  /* =================== start =================== */
  if (!IN_GAS) installedSetup();
  const cached = cacheLoad();
  if (cached && cached.rows && cached.accounts && cached.accounts.taka) { try { DONE = DONE.filter(x => !inData(cached, x)); useData(cached); setSync('Saved copy, updating…'); } catch (e) { D = null; } }
  if (!IN_GAS && (!apiConf() || sessionStorage.getItem('mmb.pre'))) askConnect('Connect this phone to your sheet.');
  else refresh(!!D).then(() => flushQueue());
  paintSync();
})();
</script>
</body>
